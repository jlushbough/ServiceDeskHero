name: Game playtest
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: game-playtest-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-playtest-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
